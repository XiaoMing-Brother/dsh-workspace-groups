<svg xmlns="http://www.w3.org/2000/svg" width="276" height="330" viewBox="0 0 276 330" role="img" aria-label="工作区分区示意图：展开分区">
  <rect width="276" height="330" fill="#f4f5f7"/>
  <rect x="12" y="12" width="252" height="306" rx="10" fill="#fbfbfd" stroke="#e6e8ec"/>

  <!-- header -->
  <text x="26" y="36" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#8a9099">工作区</text>
  <!-- + button -->
  <path d="M232 27h8M236 23v8" stroke="#8a9099" stroke-width="1.4" stroke-linecap="round"/>
  <!-- add folder button -->
  <path d="M248 23h9l2 2h9v8h-20z" fill="none" stroke="#8a9099" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M257 26.5v5M254.5 29h5" stroke="#8a9099" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 分区 A collapsed -->
  <path d="M27 60l4 3.2-4 3.2z" fill="#9aa0aa"/>
  <text x="40" y="66.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#24272c">分区 A</text>

  <!-- 分区 B collapsed -->
  <path d="M27 86l4 3.2-4 3.2z" fill="#9aa0aa"/>
  <text x="40" y="92.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#24272c">分区 B</text>

  <!-- 分区 C expanded -->
  <path d="M27 111.5l4 3-4 3z" fill="#9aa0aa"/>
  <text x="40" y="118.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#24272c">分区 C</text>

  <!-- workspace 项目一 (active) -->
  <rect x="24" y="128" width="228" height="26" rx="6" fill="#e9edff"/>
  <path d="M36 136h10v9H36z" fill="none" stroke="#7c8797" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="54" y="145.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#24272c">项目一</text>
  <text x="238" y="145.5" text-anchor="end" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#9aa0aa">2</text>

  <!-- session rows -->
  <circle cx="66" cy="164" r="2.4" fill="#c6cad2"/>
  <text x="76" y="167.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#4a4f57">示例会话一</text>
  <circle cx="66" cy="184" r="2.4" fill="#4d6bfe"/>
  <text x="76" y="187.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#24272c">示例会话二</text>

  <!-- workspace 项目二 -->
  <path d="M36 204h10v9H36z" fill="none" stroke="#7c8797" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="54" y="213.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#24272c">项目二</text>
  <text x="238" y="213.5" text-anchor="end" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#9aa0aa">1</text>

  <!-- workspace 项目三 -->
  <path d="M36 230h10v9H36z" fill="none" stroke="#7c8797" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="54" y="239.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#24272c">项目三</text>
  <text x="238" y="239.5" text-anchor="end" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#9aa0aa">5</text>

  <!-- 未分组 -->
  <path d="M27 262l4 3-4 3z" fill="#9aa0aa"/>
  <text x="40" y="269" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#24272c">未分组</text>
</svg>
